name: Build Droid Player APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Web Assets
        run: |
          if [ -f "package.json" ]; then
            npm install
            npx vite build --base=./ || npm run build || echo "Build script skipped"
            if [ -d "dist" ]; then mv dist www; elif [ -d "build" ]; then mv build www; fi
          fi
          
          # If www doesn't exist yet, treat it as a plain HTML project and copy everything
          if [ ! -d "www" ]; then
            mkdir -p www
            find . -maxdepth 1 ! -name 'www' ! -name '.git' ! -name '.github' ! -name '.' -exec cp -r {} www/ \;
          fi
          
          # Safety Check: If index.html is missing, create a visible error instead of a blank white screen
          if [ ! -f "www/index.html" ]; then
            echo "<h3 style='text-align:center;margin-top:50px;color:red;'>Error: index.html not found! Check GitHub file structure.</h3>" > www/index.html
          fi

      - name: Wrap into Native Android Project
        run: |
          if [ ! -f "package.json" ]; then npm init -y; fi
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          npx cap init "Droid Player" "com.rxtritik.droidplayer" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Compile Debug APK
        run: |
          cd android
          
          # Force unified Kotlin version to fix duplicate class errors
          cat <<EOF >> build.gradle
          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          EOF
          
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: Droid-Player-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
